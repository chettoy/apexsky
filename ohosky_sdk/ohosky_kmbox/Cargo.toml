[package]
name = "ohosky_kmbox"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.98"
embedded-graphics = "0.8.1"
obfstr = "0.4.4"
once_cell = "1.21.3"
rand = "0.9.1"
serial2-tokio = { version = "0.1.15", features = ["unix", "windows"] }
thiserror = "2.0.12"
tokio = { version = "1.45.0", features = ["net", "io-util", "time"] }
tracing = "0.1.41"
zerocopy = { version = "0.8.25", features = ["derive", "simd-nightly"] }
