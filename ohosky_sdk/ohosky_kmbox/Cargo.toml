[package]
name = "ohosky_kmbox"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.100"
embedded-graphics = "0.8.1"
obfstr = "0.4.4"
once_cell = "1.21.3"
rand = "0.9.2"
serial2-tokio = { version = "0.1.19", features = ["unix", "windows"] }
thiserror = "2.0.17"
tokio = { version = "1.49.0", features = ["net", "io-util", "time"] }
tracing = "0.1.44"
zerocopy = { version = "0.8.33", features = ["derive", "simd-nightly"] }
