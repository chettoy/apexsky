[package]
name = "ohosky_kmbox"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.102"
embedded-graphics = "0.8.2"
obfstr = "0.4.4"
once_cell = "1.21.4"
rand = "0.10.1"
serial2-tokio = { version = "0.1.23", features = ["unix", "windows"] }
thiserror = "2.0.18"
tokio = { version = "1.52.1", features = ["net", "io-util", "time"] }
tracing = "0.1.44"
zerocopy = { version = "0.8.48", features = ["derive", "simd-nightly"] }
