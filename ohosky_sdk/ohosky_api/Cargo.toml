[package]
name = "ohosky_api"
version = "0.1.0"
edition = "2024"

[lib]
name = "ohosky_api"
crate-type = ["rlib", "staticlib"]

[dependencies]
anyhow = { version = "1.0.97", features = ["backtrace"] }
async-ffi = { version = "0.5.0", features = ["macros"], optional = true }
bytes = { version = "1.10.1", features = ["serde"] }
cxx = { version = "1.0.143", features = ["c++20"], optional = true }
obfstr = "0.4.4"
rkyv = "0.8.10"
safer-ffi = { version = "0.1.13", default-features = false, features = [
    "async-fn",
    "nightly",
    "serde",
    "tokio",
], optional = true }
serde = { version = "1.0.219", features = ["derive"] }
secrecy = "0.10.3"
tokio = { version = "1.44.0", features = [
    "sync",
    "macros",
    "io-util",
    "rt",
    "time",
] }
tracing = "0.1.41"
wit-bindgen = { version = "0.40.0", optional = true }
zerocopy = "0.8.23"

[build-dependencies]
cxx-build = "1.0.143"

[features]
default = []
cxx = ["dep:cxx"]
ohosky = ["wit-bindgen"]
skydream = ["async-ffi", "safer-ffi"]
