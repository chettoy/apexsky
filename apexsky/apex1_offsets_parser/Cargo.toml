[package]
name = "apex1_offsets_parser"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = { version = "1.0.98", features = ["backtrace"] }
apex1_common = { path = "../apex1_common", default-features = false, features = ["ohosky"] }
chrono = { version = "0.4.41", features = ["serde"] }
indexmap = { version = "2.10.0", features = ["serde"] }
obfstr = "0.4.4"
ohosky_api = { path = "../../ohosky_sdk/ohosky_api", default-features = false, features = ["ohosky"] }
once_cell = "1.21.3"
paste = "1.0.15"
rand = "0.9.1"
rust-ini = "0.21.1"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = { version = "1.0.140", features = ["preserve_order"] }
