[package]
name = "apex1_offsets_parser"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = { version = "1.0.95", features = ["backtrace"] }
apex1_common = { path = "../apex1_common", default-features = false, features = ["ohosky"] }
chrono = { version = "0.4.39", features = ["serde"] }
indexmap = { version = "2.7.1", features = ["serde"] }
obfstr = "0.4.4"
ohosky_api = { path = "../../ohosky_sdk/ohosky_api", default-features = false, features = ["ohosky"] }
once_cell = "1.20.2"
paste = "1.0.15"
rand = "0.9.0"
rust-ini = "0.21.1"
serde = { version = "1.0.217", features = ["derive"] }
serde_json = { version = "1.0.138", features = ["preserve_order"] }
