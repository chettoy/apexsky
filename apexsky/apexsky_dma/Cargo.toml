[package]
name = "apexsky_dma"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib"]

[dependencies]
anyhow = "1.0.102"
apex1_common = { path = "../apex1_common", features = ["skydream"] }
async-trait = "0.1.89"
axum = { version = "0.8.9", features = ["tracing"] }
bitset-core = "0.1.1"
bytes = "1.11.1"
chrono = "0.4.44"
#console-subscriber = "0.1.5"
crossterm = "0.29.0"
dataview = "1.0.2"
dashmap = "6.1.0"
enum_dispatch = "0.3.13"
fluent = "0.17.0"
futures-util = "0.3.32"
hex = { version = "0.4.3", features = ["serde"] }
include-flate = "0.3.3"
indexmap = "2.14.0"
itertools = "0.14.0"
named_constants = "0.2.0"
ndarray = "0.17.2"
obfstr = "0.4.4"
ohosky_api = { path = "../../ohosky_sdk/ohosky_api", default-features = false, features = ["skydream"] }
#ohosky_dmalib = { path = "../../ohosky_sdk/ohosky_dmalib" }
ohosky_kmbox = { path = "../../ohosky_sdk/ohosky_kmbox" }
ohosky_menu = { path = "../../ohosky_sdk/ohosky_menu" }
once_cell = "1.21.4"
parking_lot = { version = "0.12.5", features = ["nightly"] }
prost = "0.14.3"
qapi = { version = "0.15.0", features = ["qmp", "async-tokio-all"] }
qrcode = "0.14.1"
rand = "0.10.1"
regex = "1.12.3"
rkyv = "0.8.16"
secrecy = "0.10.3"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = { version = "1.0.149", features = ["preserve_order"] }
strum = { version = "0.28.0", features = ["derive"] }
strum_macros = "0.28.0"
thiserror = "2.0.18"
tokio = { version = "1.52.1", features = ["full"] }
tokio-stream = "0.1.18"
tonic = { version = "0.14.5", features = ["zstd", "gzip"] }
tonic-web = "0.14.5"
tower = { version = "0.5.3", features = ["util"] }
tower-http = { version = "0.6.8", features = ["compression-full", "cors", "decompression-full", "fs", "timeout", "trace"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["json", "chrono", "env-filter"] }
tracing-appender = "0.2.5"
unic-langid = "0.9.6"
zbus = { version = "5.15.0", default-features = false, features = ["tokio", "blocking-api"] }
zerocopy = { version = "0.8.48", features = ["simd-nightly", "derive", "std"] }

[features]
default = ["skydream"]
ohosky_dmalib = []
skydream = []
