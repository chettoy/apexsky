[package]
name = "apexsky_dma"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
anyhow = "1.0.95"
apex1_common = { path = "../apex1_common", features = ["skydream"] }
async-trait = "0.1.85"
bitset-core = "0.1.1"
chrono = "0.4.39"
#console-subscriber = "0.1.5"
crossterm = "0.28.1"
dataview = "1.0.1"
dashmap = "6.1.0"
enum_dispatch = "0.3.13"
fluent = "0.16.1"
futures-util = "0.3.31"
hex = { version = "0.4.3", features = ["serde"] }
include-flate = { git = "https://github.com/SOF3/include-flate", rev = "fe2e113" }
indexmap = "2.7.0"
itertools = "0.14.0"
named_constants = "0.2.0"
ndarray = "0.16.1"
obfstr = "0.4.4"
ohosky_api = { path = "../../ohosky_sdk/ohosky_api", default-features = false, features = ["skydream"] }
ohosky_kmbox = { path = "../../ohosky_sdk/ohosky_kmbox" }
ohosky_menu = { path = "../../ohosky_sdk/ohosky_menu" }
once_cell = "1.20.2"
parking_lot = { version = "0.12.3", features = ["nightly"] }
prost = "0.13.4"
qapi = { version = "0.15.0", features = ["qmp", "async-tokio-all"] }
rand = "0.8.5"
regex = "1.11.1"
rkyv = "0.8.9"
secrecy = "0.10.3"
serde = { version = "1.0.217", features = ["derive"] }
serde_json = { version = "1.0.135", features = ["preserve_order"] }
strum = { version = "0.26.3", features = ["derive"] }
strum_macros = "0.26.4"
thiserror = "2.0.10"
tokio = { version = "1.43.0", features = ["full"] }
tonic = { version = "0.12.3", features = ["zstd", "gzip"] }
tonic-web = "0.12.3"
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.19", features = ["json", "chrono", "env-filter"] }
tracing-appender = "0.2.3"
unic-langid = "0.9.5"
zbus = { version = "5.2.0", default-features = false, features = ["tokio", "blocking-api"] }
