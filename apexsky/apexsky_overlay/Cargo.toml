[package]
name = "apexsky_overlay"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.100"
apex1_common = { path = "../apex1_common", default-features = false, optional = true }
async-trait = "0.1.89"
bevy = { version = "=0.17.3", features = ["wayland"] }
bevy_async_task = "0.11.1"
bevy_egui = "=0.38.1"
bevy_health_bar3d = { git = "https://github.com/bahildebrand/bevy_health_bar3d", rev = "707ab1ff8fb9cb96c9b610d00a11ae003a7d5099" }
chrono = "0.4.43"
#console-subscriber = "0.4.0"
homedir = { version = "0.3.6", optional = true }
fyrox-sound = "0.36.2"
rand = "0.9.2"
indexmap = "2.13.0"
instant = "0.1.13"
ndarray = "0.17.2"
obfstr = "0.4.4"
once_cell = "1.21.3"
parking_lot = { version = "0.12.5", features = ["nightly"] }
prost = "0.14.3"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = { version = "1.0.149", features = ["preserve_order"] }
thiserror = "2.0.17"
tokio = { version = "1.49.0", features = ["rt", "macros"] }
tonic = { version = "0.14.2", default-features = false, features = [
    "codegen",
] }
tonic-prost = "0.14.2"
tonic-web-wasm-client = { version = "0.8.0", optional = true }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.22", features = [
    "json",
    "chrono",
    "env-filter",
] }
tracing-appender = { version = "0.2.4", optional = true }
tracing-web = { version = "0.1.3", optional = true }
url = "2.5.8"
wasm-bindgen-futures = { version = "0.4.58", optional = true }
web-sys = { version = "0.3.85", optional = true, features = [
    "Document",
    "Location",
    "Screen",
    "UrlSearchParams",
    "Window",
] }

[target.'cfg(unix)'.dependencies]
uzers = "0.12.2"

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.3.4", default-features = false, features = ["wasm_js"] }

[build-dependencies]
tonic-prost-build = "0.14.2"

[features]
default = ["native"]
native = ["homedir", "tokio/full", "tonic/transport", "tonic/zstd", "tracing-appender"]
web-wasm = [
    "tonic-web-wasm-client",
    "tracing-web",
    "instant/wasm-bindgen",
    "wasm-bindgen-futures",
    "web-sys",
]
web-wasm-webgpu = ["web-wasm", "bevy/webgpu"]
web-wasm-webgl = ["web-wasm", "bevy/webgl2"]
apex1-inspect = ["apex1_common"]
