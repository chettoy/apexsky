[package]
name = "apexsky_overlay"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.97"
apex1_common = { path = "../apex1_common", default-features = false, optional = true }
async-trait = "0.1.88"
bevy = { version = "0.15.3", features = ["wayland"] }
bevy_async_task = "0.5.0"
bevy_egui = "0.33.0"
bevy_health_bar3d = "3.4.0"
chrono = "0.4.40"
#console-subscriber = "0.4.0"
homedir = { version = "0.3.4", optional = true }
fyrox-sound = "0.36.2"
rand = "0.9.0"
indexmap = "2.9.0"
instant = "0.1.13"
ndarray = "0.16.1"
obfstr = "0.4.4"
once_cell = "1.21.3"
parking_lot = { version = "0.12.3", features = ["nightly"] }
prost = "0.13.5"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = { version = "1.0.140", features = ["preserve_order"] }
thiserror = "2.0.12"
tokio = { version = "1.44.2", features = ["rt", "macros"] }
tonic = { version = "0.13.0", default-features = false, features = [
    "prost",
    "codegen",
] }
tonic-web-wasm-client = { version = "0.7.0", optional = true }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.19", features = [
    "json",
    "chrono",
    "env-filter",
] }
tracing-appender = { version = "0.2.3", optional = true }
tracing-web = { version = "0.1.3", optional = true }
url = "2.5.4"
wasm-bindgen-futures = { version = "0.4.50", optional = true }
web-sys = { version = "0.3.77", optional = true, features = [
    "Document",
    "Location",
    "Screen",
    "UrlSearchParams",
    "Window",
] }

[target.'cfg(unix)'.dependencies]
uzers = "0.12.1"

[build-dependencies]
tonic-build = "0.13.0"

[features]
default = ["native"]
native = ["homedir", "tokio/full", "tonic/transport", "tonic/zstd", "tracing-appender"]
web-wasm = [
    "tonic-web-wasm-client",
    "tracing-web",
    "instant/wasm-bindgen",
    "wasm-bindgen-futures",
    "web-sys",
]
web-wasm-webgpu = ["web-wasm", "bevy/webgpu"]
web-wasm-webgl = ["web-wasm", "bevy/webgl2"]
apex1-inspect = ["apex1_common"]
