# This starter workflow is for a CMake project running on multiple platforms. There is a different starter workflow if you just want a single platform.
# See: https://github.com/actions/starter-workflows/blob/main/ci/cmake-single-platform.yml
name: CI

on:
  push:
    branches: ["main", "next", "dev"]
  pull_request:
    branches: ["main", "next", "dev"]

jobs:
  build:
    runs-on: ${{ matrix.os }}

    strategy:
      # Set fail-fast to false to ensure that feedback is delivered for all matrix combinations. Consider changing this to true when your workflow is stable.
      fail-fast: false

      # Set up a matrix to run the following 2 configurations:
      # 1. <Windows, Release, latest MSVC compiler toolchain on the default runner image, default generator>
      # 2. <Linux, Release, latest Clang compiler toolchain on the default runner image, default generator>
      #
      # To add more build types (Release, Debug, RelWithDebInfo, etc.) customize the build_type list.
      matrix:
        os: [ubuntu-latest, windows-latest]
        build_type: [Release]
        c_compiler: [clang, cl]
        include:
          - os: ubuntu-latest
            c_compiler: clang
            cpp_compiler: clang++
            arch-name: x86_64-unknown-linux-gnu
            target: x86_64-unknown-linux-gnu
            bin-prefix: ""
            bin-ext: ""
            lib-prefix: lib
            lib-ext: .so
          - os: windows-latest
            c_compiler: cl
            cpp_compiler: cl
            arch-name: x86_64-pc-windows-msvc
            target: x86_64-pc-windows-msvc
            bin-prefix: ""
            bin-ext: .exe
            lib-prefix: ""
            lib-ext: .dll
        exclude:
          - os: ubuntu-latest
            c_compiler: cl
          - os: windows-latest
            c_compiler: clang

    outputs:
      sha_short: ${{ steps.strings.outputs.sha_short }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - run: rustup default nightly

      - name: Install dependencies (Ubuntu)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt update
          sudo apt install libusb-1.0-0-dev libzstd-dev pkg-config libx11-dev libasound2-dev libudev-dev libxkbcommon-x11-0 libwayland-dev libxkbcommon-dev

      - name: Install dependencies (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          git clone https://github.com/Microsoft/vcpkg.git
          cd vcpkg
          .\bootstrap-vcpkg.bat
          .\vcpkg integrate install
          .\vcpkg install zstd:x64-windows

      - name: Install Protoc
        uses: arduino/setup-protoc@v3

      - name: Set reusable strings
        # Turn repeated input strings (such as the build output directory) into step outputs. These step outputs can be used throughout the workflow file.
        id: strings
        shell: bash
        run: |
          echo "build-output-dir=${{ github.workspace }}/build" >> "$GITHUB_OUTPUT"
          echo "sha_short=$(echo ${{ github.sha }} | cut -c1-7)" >> $GITHUB_OUTPUT

      - name: Build
        run: cd apexsky && cargo build --release --target ${{ matrix.target }}

      - name: Build Overlay
        run: cd apexsky/apexsky_overlay && cargo build --release --target ${{ matrix.target }}

      # - name: Test
      #   working-directory: ${{ steps.strings.outputs.build-output-dir }}
      #   # Execute tests defined by the CMake configuration. Note that --build-config is needed because the default Windows generator is a multi-config generator (Visual Studio generator).
      #   # See https://cmake.org/cmake/help/latest/manual/ctest.1.html for more detail
      #   run: ctest --build-config ${{ matrix.build_type }}

      # - name: Archive output artifacts
      #   uses: actions/upload-artifact@v4
      #   if: always()
      #   with:
      #     name: output-${{ matrix.arch-name }}
      #     path: |
      #       apexsky/target/${{ matrix.target }}/release
      #     retention-days: 2

      - name: Archive production artifacts
        uses: actions/upload-artifact@v4
        with:
          name: apexsky_dma_${{ steps.strings.outputs.sha_short }}_b${{ github.run_number }}-${{ matrix.arch-name }}
          path: |
            apexsky/target/${{ matrix.target }}/release/${{ matrix.lib-prefix }}apexsky_dma${{ matrix.lib-ext }}
            apexsky/target/${{ matrix.target }}/release/${{ matrix.bin-prefix }}apexsky_overlay${{ matrix.bin-ext }}
          retention-days: 1

  build-mod:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: apexsky-artifact
          pattern: apexsky_dma_${{ needs.build.outputs.sha_short }}_b${{ github.run_number }}-*
          merge-multiple: true
      - run: ls -R apexsky-artifact

      - name: Install Protoc
        uses: arduino/setup-protoc@v3

      - name: Build other modules
        run: |
          sudo apt update
          sudo apt install libzstd-dev pkg-config gcc-multilib
          rustup default nightly
          rustup target add wasm32-wasip2
          cd apexsky/apex1_offsets_parser && cargo build --release --target wasm32-wasip2

      - name: Pack mods
        run: |
          rm apexsky/mods/apex1/native/x86_64-linux/*
          rm apexsky/mods/apex1/native/x86_64-windows/*
          cp apexsky-artifact/libapexsky_dma.so apexsky/mods/apex1/native/x86_64-linux/
          cp apexsky-artifact/apexsky_dma.dll apexsky/mods/apex1/native/x86_64-windows/
          ./ohosky_sdk/bin/x86_64-unknown-linux-gnu/ohosky_mod_packer apexsky-artifact/apex1.spk apexsky/mods/apex1/manifest.json
          ./ohosky_sdk/bin/x86_64-unknown-linux-gnu/ohosky_mod_packer apexsky-artifact/apex1_sg.spk apexsky/mods/apex1_sg/manifest.json

      - name: Archive mods
        uses: actions/upload-artifact@v4
        with:
          name: mods_${{ needs.build.outputs.sha_short }}_b${{ github.run_number }}
          path: |
            apexsky-artifact/apex1.spk
            apexsky-artifact/apex1_sg.spk
            apexsky-artifact/apexsky_overlay
            apexsky-artifact/apexsky_overlay.exe
          retention-days: 5
