[package]
name = "esp_iot"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.98"
apex1_common = { path = "../apexsky/apex1_common", features = ["tonic"]}
buttplug = "9.0.8"
chrono = "0.4.41"
prost = "=0.13"
rand = "0.9.1"
tokio = { version = "1.45.1", features = ["full"] }
tonic = { version = "0.13.1", features = ["zstd"] }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.19", features = ["json", "chrono", "env-filter"] }
tracing-appender = "0.2.3"
