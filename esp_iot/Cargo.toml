[package]
name = "esp_iot"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.97"
apex1_common = { path = "../apexsky/apex1_common", features = ["tonic"]}
buttplug = "9.0.7"
chrono = "0.4.40"
prost = "0.13.5"
rand = "0.9.0"
tokio = { version = "1.44.1", features = ["full"] }
tonic = { version = "0.13.0", features = ["zstd"] }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.19", features = ["json", "chrono", "env-filter"] }
tracing-appender = "0.2.3"
