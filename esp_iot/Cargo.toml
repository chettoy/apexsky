[package]
name = "esp_iot"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.95"
apex1_common = { path = "../apexsky/apex1_common", features = ["tonic"]}
buttplug = "9.0.6"
chrono = "0.4.39"
prost = "0.13.4"
rand = "0.9.0"
tokio = { version = "1.43.0", features = ["full"] }
tonic = { version = "0.12.3", features = ["zstd"] }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.19", features = ["json", "chrono", "env-filter"] }
tracing-appender = "0.2.3"
