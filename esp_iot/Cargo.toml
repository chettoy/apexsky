[package]
name = "esp_iot"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.100"
apex1_common = { path = "../apexsky/apex1_common", features = ["tonic"]}
buttplug = "9.0.9"
chrono = "0.4.43"
prost = "0.14.3"
rand = "0.9.2"
tokio = { version = "1.49.0", features = ["full"] }
tonic = { version = "0.14.2", features = ["zstd"] }
tonic-prost = "0.14.2"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.22", features = ["json", "chrono", "env-filter"] }
tracing-appender = "0.2.4"
